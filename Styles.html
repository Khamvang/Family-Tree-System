<style>
  :root {
    --bg: #f6f5ee;          /* soft parchment */
    --bg-alt: #edece1;
    --ink: #22301f;         /* deep botanical ink */
    --ink-soft: #5a6650;
    --accent: #4a6741;      /* moss green */
    --accent-dark: #34492e;
    --gold: #b8902f;        /* aged-gold highlight */
    --line: #d8d5c4;
    --card-bg: #fffdf6;
    --danger: #a4432f;
    --radius: 10px;
    --shadow: 0 2px 10px rgba(34, 48, 31, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }

  h1, h2, h3 {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    margin: 0 0 0.3em 0;
    letter-spacing: 0.2px;
  }

  .container { max-width: 960px; margin: 0 auto; padding: 40px 24px; }

  /* The Add/Edit Member form specifically reads better narrow and centered,
     rather than stretching across the whole panel width. */
  .panel-form .container {
    max-width: 620px;
    margin: 32px auto;
    padding: 32px 36px;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }

  .subtitle { color: var(--ink-soft); margin-bottom: 32px; }

  /* --- App shell: sidebar + panels --- */
  .app-shell { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--card-bg);
    border-right: 1px solid var(--line);
    padding: 24px 14px;
  }
  .sidebar h1 { font-size: 17px; padding: 0 8px 20px; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  .nav-item:hover { background: var(--bg-alt); }
  .nav-item.active { background: var(--accent); color: #fff; }

  .lang-switch-fixed {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 500;
    display: flex;
    gap: 4px;
    background: var(--card-bg);
    padding: 5px;
    border-radius: 8px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .lang-btn {
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .lang-btn:hover { border-color: var(--accent); color: var(--ink); }
  .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .main-content { flex: 1; min-width: 0; overflow: hidden; }

  .panel { display: none; height: 100%; overflow-y: auto; }
  .panel.active { display: block; }

  .panel-tree { display: none; height: 100%; flex-direction: column; }
  .panel-tree.active { display: flex; }

  @media (max-width: 700px) {
    .app-shell { flex-direction: column; height: auto; min-height: 100vh; }
    .sidebar { width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px 16px; flex-wrap: wrap; }
    .sidebar h1 { padding: 0; margin: 0 12px 0 0; }
    .main-content { height: calc(100vh - 60px); }
    .lang-switch-fixed { top: 8px; right: 8px; }
    .tree-toolbar { flex-wrap: wrap; padding: 14px 20px; }
  }

  /* --- Nav / Index page --- */
  .nav-container { text-align: center; padding-top: 64px; }

  .card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 32px;
  }
  @media (max-width: 600px) { .card-grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: left;
    text-decoration: none;
    color: var(--ink);
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(34,48,31,0.14); }
  .card-icon { font-size: 28px; margin-bottom: 8px; }
  .card p { color: var(--ink-soft); margin: 6px 0 0 0; font-size: 14px; }

  /* --- Forms --- */
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 16px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  input[type="text"], input[type="date"], input[type="url"], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(74,103,65,0.15);
  }
  input:disabled {
    background: var(--bg-alt);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  /* Phetsarath OT applies only to actual Lao-language content — never to
     English or Hmong text, which keep the app's regular fonts. */
  #LaoFirstName, #LaoLastName {
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
  }
  body.lang-lo [data-i18n],
  body.lang-lo [data-i18n-placeholder]::placeholder,
  body.lang-lo #toast,
  body.lang-lo #saveModalMessage {
    font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
  }

  textarea { resize: vertical; min-height: 70px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }

  .btn {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn.secondary:hover { background: rgba(74,103,65,0.08); }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .autocomplete-wrap { position: relative; }
  .autocomplete-list {
    position: absolute;
    z-index: 20;
    left: 0; right: 0;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 8px 8px;
    max-height: 180px;
    overflow-y: auto;
    box-shadow: var(--shadow);
    display: none;
  }
  .autocomplete-list div {
    padding: 8px 12px;
    cursor: pointer;
    font-size: 14px;
  }
  .autocomplete-list div:hover { background: var(--bg-alt); }

  /* --- Upload dropzones (photo + house files) --- */
  .dropzone {
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    background: var(--bg-alt);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone:hover, .dropzone:focus { border-color: var(--accent); }
  .dropzone.dragover { border-color: var(--accent); background: rgba(74,103,65,0.1); }

  .dropzone-text { font-size: 13px; color: var(--ink-soft); }

  .dropzone-placeholder { font-size: 40px; color: var(--ink-soft); line-height: 1; }

  /* --- Circular profile photo avatar --- */
  .avatar-dropzone {
    position: relative;
    width: 140px; height: 140px;
    margin: 0 auto;
    cursor: pointer;
    outline: none;
  }
  .avatar-circle {
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 2px dashed var(--line);
    background: var(--bg-alt);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .avatar-dropzone:hover .avatar-circle,
  .avatar-dropzone:focus .avatar-circle,
  .avatar-dropzone.dragover .avatar-circle {
    border-color: var(--accent);
    background: rgba(74, 103, 65, 0.1);
  }
  .avatar-circle.has-photo { border-style: solid; border-color: var(--line); }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-circle .dropzone-placeholder { font-size: 54px; }

  .avatar-remove-btn { top: 4px; right: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.25); }

  .dropzone-gallery {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; margin-bottom: 10px;
  }
  .gallery-item { width: 84px; }
  .gallery-thumb { position: relative; width: 84px; height: 84px; }
  .gallery-thumb a { display: block; width: 100%; height: 100%; text-decoration: none; }
  .gallery-thumb img {
    width: 100%; height: 100%;
    object-fit: cover; border-radius: 8px;
    border: 1px solid var(--line);
  }
  .gallery-thumb a.gallery-file {
    display: flex; align-items: center; justify-content: center;
    background: var(--card-bg); border: 1px solid var(--line);
    border-radius: 8px; font-size: 11px;
    color: var(--ink);
  }
  .gallery-caption {
    font-size: 11px; color: var(--ink-soft);
    text-align: center; margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .remove-btn {
    position: absolute; top: -7px; right: -7px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--danger); color: #fff;
    border: 2px solid var(--card-bg);
    font-size: 13px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .remove-btn:hover { background: #8a3527; }

  .manual-links-box {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
    background: var(--card-bg);
  }
  .manual-links-box textarea { margin-top: 6px; }

  .editsearch-option { padding: 8px 12px; cursor: pointer; }
  .editsearch-option:hover { background: var(--bg-alt); }
  .editsearch-name { font-size: 14px; color: var(--ink); }
  .editsearch-detail { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--accent-dark);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    box-shadow: var(--shadow);
    display: none;
    z-index: 100;
  }
  .toast.error { background: var(--danger); }

  /* --- Big centered save-status modal --- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(34, 48, 31, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
  }
  .modal-overlay.active { display: flex; }

  .modal-box {
    background: var(--card-bg);
    padding: 48px 64px;
    border-radius: 16px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.28);
    text-align: center;
    min-width: 280px;
  }
  .modal-box.error { border: 2px solid var(--danger); }
  .modal-box.success { border: 2px solid var(--accent); }

  .modal-spinner {
    width: 44px;
    height: 44px;
    margin: 0 auto;
    border: 4px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: modal-spin 0.8s linear infinite;
  }
  @keyframes modal-spin { to { transform: rotate(360deg); } }

  .modal-icon { font-size: 44px; line-height: 1; }

  .modal-message {
    margin: 18px 0 0;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
  }
  .modal-box.error .modal-message { color: var(--danger); }

  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

  /* --- Tree page --- */
  .tree-toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 14px 190px 14px 20px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--line);
  }
  .tree-toolbar input[type="text"] { max-width: 340px; }
  #tree-canvas { width: 100%; height: calc(100vh - 66px); display: block; background: var(--bg); }

  .node rect { fill: var(--card-bg); stroke: var(--accent); stroke-width: 1.2px; }
  .node.is-focused rect { stroke: var(--gold); stroke-width: 3px; }
  .node.highlight rect { stroke: var(--gold); stroke-width: 2.5px; }
  .node text { font-size: 12px; fill: var(--ink); font-family: inherit; }
  .node .years { fill: var(--ink-soft); font-size: 10px; }
  .node .alt-name { fill: var(--ink-soft); font-size: 10px; }
  .node .node-name-link { cursor: pointer; }
  .node .node-name-link:hover { text-decoration: underline; fill: var(--accent); }
  .node .gender-icon { font-size: 13px; font-weight: bold; }
  .link { fill: none; stroke: var(--ink-soft); stroke-width: 1.4px; transition: stroke 0.15s ease, stroke-width 0.15s ease, opacity 0.15s ease; }
  .link.parent-secondary { stroke-dasharray: 4 3; opacity: 0.7; }
  .link.spouse { stroke: var(--gold); stroke-width: 2px; transition: stroke 0.15s ease, stroke-width 0.15s ease; }

  .link.hl-parent { stroke: #2f6fb0; stroke-width: 4px; opacity: 1; }
  .link.hl-child { stroke: #3a9d5d; stroke-width: 4px; opacity: 1; }
  .link.spouse.hl-spouse { stroke: #e0952f; stroke-width: 5px; }
  .node circle.toggle { fill: var(--accent); cursor: pointer; }
  .node text.toggle-label { fill: #fff; font-size: 10px; text-anchor: middle; pointer-events: none; }

  @media print {
    .sidebar, .lang-switch-fixed, .tree-toolbar, .remove-btn, .toast, .modal-overlay { display: none !important; }
    .app-shell, .main-content, .panel-tree { height: auto !important; overflow: visible !important; }
    #tree-canvas { width: 100% !important; height: auto !important; }
    body { background: #fff; }
  }

  /* --- Guideline accordion --- */
  .accordion { margin-top: 20px; }
  .accordion-item {
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
    background: var(--card-bg);
  }
  .accordion-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    background: none;
    border: none;
    text-align: left;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }
  .accordion-header:hover { background: var(--bg-alt); }
  .accordion-icon {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .accordion-body { display: none; padding: 0 16px 16px; }
  .accordion-item.open .accordion-body { display: block; }
  .accordion-body p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.6; }

  /* --- Tree node avatar thumbnail --- */
  .avatar-bg { fill: var(--bg-alt); }
  .avatar-ring { stroke: var(--line); stroke-width: 1.2px; }
  .avatar-placeholder { font-size: 13px; fill: var(--ink-soft); pointer-events: none; }

  /* --- Full-size photo lightbox --- */
  .image-lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 20, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 600;
    cursor: zoom-out;
  }
  .image-lightbox-overlay.active { display: flex; }
  .image-lightbox-overlay img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 10px;
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
  }
</style>
